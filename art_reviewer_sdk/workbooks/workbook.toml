# One workbook = one artwork test run.
# Run:  uv run python art_reviewer_sdk/run_workbook.py art_reviewer_sdk/workbooks/workbook.toml
# Or sweep every artwork in artworks.json (auto-numbered TEST-001, TEST-002, …;
# the artwork_id/artwork keys below are ignored):
#       uv run python art_reviewer_sdk/run_workbook.py --all
#
# Artwork facts (image path, title, artist, work type, description, collector
# preferences) live in artworks.json next to this file — reference an entry by
# its id via `artwork` below. Any of those fields can still be set directly in
# this TOML for a one-off override (TOML always wins over the catalog), and a
# TOML with no `artwork` key works fully inline like before.

# Test-run label — names the results file (results/<artwork_id>.json).
#/////////////////////////
artwork_id = "TEST-001"
#/////////////////////////

# Which artwork to test — a key in artworks.json. Available ids:
#/////////////////////////
artwork    = "proof-of-war"
#/////////////////////////

# catalog  = "artworks.json"   # optional — path to a different catalog file

# Models to test — exact API IDs; each runs every condition. Omit this line
# to use the harness default (MODELS in run_workbook.py).
#
# Usable vision-capable models (verified against our keys 2026-07-06; see
# README "Available models" to re-query):
#   OpenAI:  gpt-5.5, gpt-5.5-pro, gpt-5.4, gpt-5.4-mini, gpt-5.2, gpt-5.1,
#            gpt-5, gpt-5-mini, gpt-5-nano, gpt-4.1, gpt-4.1-mini, gpt-4o,
#            gpt-4o-mini, o3, o4-mini
#   Gemini:  gemini-3.5-flash, gemini-3.1-pro-preview, gemini-3-pro-preview,
#            gemini-3-flash-preview, gemini-2.5-pro, gemini-2.5-flash,
#            gemini-2.5-flash-lite
#   Claude:  claude-opus-4-8, claude-fable-5, claude-opus-4-7,
#            claude-sonnet-4-6, claude-haiku-4-5
#            (exact IDs as written — no date suffixes)
#/////////////////////////
models = ["claude-haiku-4-5","claude-sonnet-4-6"]
#/////////////////////////

# Which system prompt to use: review_prompt_<N>.py (used for the reviews AND
# recorded in the results JSON).
#/////////////////////////
review_prompt = 5
#/////////////////////////
